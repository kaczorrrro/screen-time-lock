<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Delayed Hello</title>
<style>
body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  height: 100vh;
  margin: 0;
  font-family: Arial, sans-serif;
  font-size: 2rem;
  gap: 1rem;
}

.panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1rem;
}
.panel[hidden] {
  display: none;
}

#message {
  opacity: 0;
  transition: opacity 1s ease;
}
#message.show {
  opacity: 1;
}

button:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}

#setup {
  font-size: 1rem;
  max-width: calc(100vw - 2rem);
}
#setupOutput {
  white-space: pre-wrap;
  word-break: break-all;
}
</style>
</head>
<body>

<div id="unlock" class="panel">
  <div id="timer"></div>
  <button id="startBtn">Start</button>
  <button id="enableBtn" disabled>Enable</button>
  <div id="message"></div>
</div>

<form id="setup" class="panel" hidden>
  <input id="setupPassword" placeholder="Password" autocomplete="off" required />
  <label>Seconds <input id="setupSeconds" type="number" value="10" min="1" required /></label>
  <button id="setupBtn">Generate</button>
  <pre id="setupOutput"></pre>
</form>

<script>
// Generated by opening this page with ?setup. Unlocking hashes SEED with SHA-256
// ITERATIONS times; XOR-ing CIPHERTEXT with the last digest gives the password.
const SEED = "fc4236db00a8de0b5cf23151b3f95a58df101b2874fe673b442bf719ab4c1e20";
const ITERATIONS = 704621568;
const CIPHERTEXT = "9fc3e28a181c21fd00aef71812d357138d794d28";

// Hashing pauses after this much hashing time, until the user presses Enable.
const CHECK_IN_MS = 10000;
// Longest stretch of hashing between two UI updates.
const CHUNK_MS = 50;

const timerEl = document.getElementById("timer");
const startButtonEl = document.getElementById("startBtn");
const buttonEl = document.getElementById("enableBtn");
const messageEl = document.getElementById("message");

let enabled = true;

// Int32Array keeps every word a 32-bit integer, which is what SHA-256 needs and
// what JavaScript engines run fastest.
const SHA256_K = Int32Array.from([
  0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5,
  0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
  0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da,
  0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
  0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85,
  0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
  0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3,
  0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2,
]);

const SHA256_INITIAL = Int32Array.from([
  0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a,
  0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19,
]);

const schedule = new Int32Array(64);

function rotateRight(value, amount) {
  return (value >>> amount) | (value << (32 - amount));
}

// Replaces `digest` (8 words) with its own SHA-256. A 32-byte message fits in
// one block, so the padding is fixed: a 1 bit after the data, then the length, 256.
function sha256Digest(digest) {
  const words = schedule;
  words.set(digest);
  words[8] = 0x80000000;
  words.fill(0, 9, 15);
  words[15] = 256;

  for (let i = 16; i < 64; i++) {
    const s0 = rotateRight(words[i - 15], 7) ^ rotateRight(words[i - 15], 18) ^ (words[i - 15] >>> 3);
    const s1 = rotateRight(words[i - 2], 17) ^ rotateRight(words[i - 2], 19) ^ (words[i - 2] >>> 10);
    words[i] = words[i - 16] + s0 + words[i - 7] + s1;
  }

  let a = SHA256_INITIAL[0];
  let b = SHA256_INITIAL[1];
  let c = SHA256_INITIAL[2];
  let d = SHA256_INITIAL[3];
  let e = SHA256_INITIAL[4];
  let f = SHA256_INITIAL[5];
  let g = SHA256_INITIAL[6];
  let h = SHA256_INITIAL[7];

  for (let i = 0; i < 64; i++) {
    const s1 = rotateRight(e, 6) ^ rotateRight(e, 11) ^ rotateRight(e, 25);
    const ch = (e & f) ^ (~e & g);
    const temp1 = (h + s1 + ch + SHA256_K[i] + words[i]) | 0;
    const s0 = rotateRight(a, 2) ^ rotateRight(a, 13) ^ rotateRight(a, 22);
    const maj = (a & b) ^ (a & c) ^ (b & c);
    const temp2 = (s0 + maj) | 0;

    h = g;
    g = f;
    f = e;
    e = (d + temp1) | 0;
    d = c;
    c = b;
    b = a;
    a = (temp1 + temp2) | 0;
  }

  digest[0] = SHA256_INITIAL[0] + a;
  digest[1] = SHA256_INITIAL[1] + b;
  digest[2] = SHA256_INITIAL[2] + c;
  digest[3] = SHA256_INITIAL[3] + d;
  digest[4] = SHA256_INITIAL[4] + e;
  digest[5] = SHA256_INITIAL[5] + f;
  digest[6] = SHA256_INITIAL[6] + g;
  digest[7] = SHA256_INITIAL[7] + h;
}

// Hashes `digest` in place up to `limit` times, stopping early once CHUNK_MS
// has passed. Returns how many times it hashed.
function hashChunk(digest, limit) {
  const start = performance.now();
  let done = 0;

  while (done < limit) {
    const batch = Math.min(1024, limit - done);
    for (let i = 0; i < batch; i++) {
      sha256Digest(digest);
    }
    done += batch;

    if (performance.now() - start >= CHUNK_MS) {
      break;
    }
  }

  return done;
}

function sleep(ms) {
  return new Promise((resolve) => setTimeout(resolve, ms));
}

function hexToDigest(hex) {
  return Int32Array.from(hex.match(/.{8}/g), (word) => parseInt(word, 16));
}

function digestToHex(digest) {
  return Array.from(digest, (word) => (word >>> 0).toString(16).padStart(8, "0")).join("");
}

function hexToBytes(hex) {
  return Uint8Array.from(hex.match(/../g), (byte) => parseInt(byte, 16));
}

function bytesToHex(bytes) {
  return Array.from(bytes, (byte) => byte.toString(16).padStart(2, "0")).join("");
}

function xorWithDigest(bytes, digest) {
  const key = hexToBytes(digestToHex(digest));
  return bytes.map((byte, i) => byte ^ key[i]);
}

async function unlock() {
  const digest = hexToDigest(SEED);
  let done = 0;
  let hashingMs = 0;
  let sinceCheckInMs = 0;

  while (done < ITERATIONS) {
    while (!enabled) {
      await sleep(100);
    }

    const chunkStart = performance.now();
    done += hashChunk(digest, ITERATIONS - done);
    const chunkMs = performance.now() - chunkStart;
    hashingMs += chunkMs;
    sinceCheckInMs += chunkMs;

    const secondsLeft = (ITERATIONS - done) * hashingMs / done / 1000;
    timerEl.textContent = `${Math.floor(100 * done / ITERATIONS)}% | ~${Math.ceil(secondsLeft)}s`;

    if (sinceCheckInMs >= CHECK_IN_MS && done < ITERATIONS) {
      sinceCheckInMs = 0;
      enabled = false;
      updateButton();
    }

    await sleep(0);
  }

  timerEl.textContent = "";
  messageEl.textContent = new TextDecoder().decode(xorWithDigest(hexToBytes(CIPHERTEXT), digest));
  messageEl.classList.add("show");
}

// keep button state in sync
function updateButton() {
  buttonEl.disabled = enabled;
}

buttonEl.addEventListener("click", () => {
  enabled = true;
  updateButton();
});

updateButton();
startButtonEl.addEventListener("click", () => {
  startButtonEl.disabled = true;
  unlock();
});

// Setup: picks a random seed, hashes it for the given time and encrypts the
// password with the last digest. Run it on the device that will unlock: the
// iteration count is what that device manages in that time.
const setupEl = document.getElementById("setup");
const setupOutputEl = document.getElementById("setupOutput");

async function setUp(password, seconds) {
  const seed = crypto.getRandomValues(new Int32Array(8));
  const digest = seed.slice();
  let iterations = 0;
  const end = performance.now() + seconds * 1000;

  while (performance.now() < end) {
    iterations += hashChunk(digest, Infinity);
    setupOutputEl.textContent = `Hashing... ${Math.ceil((end - performance.now()) / 1000)}s`;
    await sleep(0);
  }

  return [
    `const SEED = "${digestToHex(seed)}";`,
    `const ITERATIONS = ${iterations};`,
    `const CIPHERTEXT = "${bytesToHex(xorWithDigest(password, digest))}";`,
  ].join("\n");
}

if (new URLSearchParams(location.search).has("setup")) {
  document.getElementById("unlock").hidden = true;
  setupEl.hidden = false;
}

setupEl.addEventListener("submit", async (event) => {
  event.preventDefault();

  // The key is one 32-byte digest; longer passwords would leak their tail.
  const password = new TextEncoder().encode(document.getElementById("setupPassword").value);
  if (password.length > 32) {
    setupOutputEl.textContent = "Password must fit in 32 bytes.";
    return;
  }

  document.getElementById("setupBtn").disabled = true;
  setupOutputEl.textContent = await setUp(password, Number(document.getElementById("setupSeconds").value));
  document.getElementById("setupBtn").disabled = false;
});
</script>
</body>
</html>
